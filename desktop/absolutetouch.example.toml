# AbsoluteTouch desktop configuration.
#
# Copy to ~/.config/absolutetouch/config.toml (or pass --config PATH).
# Precedence: command line, then ABSOLUTETOUCH_* environment variables, then
# this file, then built-in defaults.

# "wifi" (UDP) or "usb" (M4).
transport = "wifi"
bind = "0.0.0.0"
udp_port = 37689
tcp_port = 37690

# 32 hexadecimal characters. Generate one with:
#   absolutetouch token --reset
# When unset, any token is accepted; the token is still echoed in HELLO_ACK.
# token = "000102030405060708090a0b0c0d0e0f"

# Milliseconds without a valid packet before input is released.
watchdog_ms = 750
# Milliseconds without a valid packet before the session ends and a new HELLO
# is required.
session_timeout_ms = 5000
# Pressure used when the iPad reports no CAP_PRESSURE.
pressure_default = 32768

# Decode and print without injecting. Implies the mock backend with `auto`.
dry_run = false
# "auto", "mock", "uinput", "windows", or "macos". `auto` selects uinput on
# Linux; `--dry-run` always uses the mock backend.
backend = "auto"

# Virtual device registered on Linux. "pointer" is an absolute pointer that
# moves the desktop cursor on X11 and on Wayland compositors, which is what
# osu! and general pointer use need. "tablet" exposes tool, pressure, and tilt
# events for tablet-aware applications; Wayland compositors do not move the
# cursor from a stylus-class device.
device = "pointer"

[mapping]
# "preserve" letterboxes the iPad aspect ratio inside the target rectangle;
# "stretch" fills it. Preserving needs both aspect ratios.
aspect = "preserve"
source_aspect = 1.3333333333333333
# The desktop aspect ratio. Set it to match the target display; without it the
# mapping stretches.
# target_aspect = 1.7777777777777777

[mapping.target]
# Normalized desktop rectangle, 0..=65535. The full desktop is the default.
x = 0
y = 0
width = 65535
height = 65535
