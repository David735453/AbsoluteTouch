[package]
name = "absolutetouch"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Absolute tablet input bridge for iPad"
license = "MIT"
repository = "https://github.com/David735453/AbsoluteTouch"
publish = false

[[bin]]
name = "absolutetouch"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.5.2"
getrandom = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = "1.1.8"

[dev-dependencies]
hex = "0.4"
serde_json = "1.0"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
doc_markdown = "allow"
