version: 2

# Weekly, grouped updates. Keep the toolchains on stable/latest separately:
# Rust follows `stable` in CI, Xcode follows the `latest` setup-xcode input, and
# the Swift container is pinned in the workflows.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:17"
      timezone: Etc/UTC
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
    open-pull-requests-limit: 5

  - package-ecosystem: cargo
    directory: /desktop
    schedule:
      interval: weekly
      day: monday
      time: "05:17"
      timezone: Etc/UTC
    groups:
      cargo-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: deps
    open-pull-requests-limit: 5

  - package-ecosystem: swift
    directory: /ios/AbsoluteTouchCore
    schedule:
      interval: weekly
      day: monday
      time: "05:17"
      timezone: Etc/UTC
    groups:
      swift:
        patterns: ["*"]
    commit-message:
      prefix: deps
    open-pull-requests-limit: 5
