version: 2

# Weekly, grouped updates. Keep the toolchains on stable/latest separately:
# Rust follows `stable` in CI, Xcode follows the `latest` setup-xcode input, and
# the Swift container is pinned in the workflows.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:17"
      timezone: Etc/UTC
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
    open-pull-requests-limit: 5

  - package-ecosystem: cargo
    directory: /desktop
    schedule:
      interval: weekly
      day: monday
      time: "05:17"
      timezone: Etc/UTC
    groups:
      cargo-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: deps
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:17"
      timezone: Etc/UTC
    groups:
      npm:
        patterns: ["*"]
    commit-message:
      prefix: deps
    open-pull-requests-limit: 5

  # SwiftPM is intentionally missing: the package has no remote dependencies,
  # and Dependabot's Swift image still ships Swift 6.3.1, which cannot read a
  # 6.4 tools-version manifest ("using Swift tools version 6.4.0 but the
  # installed version is 6.3.1"), so every weekly run failed. Add
  #
  #   - package-ecosystem: swift
  #     directory: /ios/AbsoluteTouchCore
  #
  # back once the core depends on a package and Dependabot's image is >= 6.4.
