name: TestFlight

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload the archive to TestFlight after building"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  beta:
    name: Archive and upload
    runs-on: macos-latest
    environment: testflight
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27
        run: |
          set -euo pipefail
          for candidate in /Applications/Xcode_27*.app; do
            if [ -d "$candidate" ]; then
              sudo xcode-select -s "$candidate"
              break
            fi
          done
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Install Fastlane
        working-directory: ios
        run: |
          set -euo pipefail
          bundle config set --local path vendor/bundle
          bundle install --jobs 4

      - name: Decode App Store Connect key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::missing $name in the testflight environment"
              exit 1
            fi
          done
          printf '%s' "$ASC_KEY_P8_BASE64" \
            | tr -d '\r\n' \
            | openssl base64 -d -A -out "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Build and upload
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_SKIP_UPDATE_CHECK: "true"
          FASTLANE_HIDE_CHANGELOG: "true"
        run: bundle exec fastlane ios beta upload:${{ inputs.upload }}
