name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v prefix, for example x.y.z"
        required: true
        type: string
        default: "0.0.1"
      testflight:
        description: "Archive a signed iOS build and upload it to TestFlight"
        type: boolean
        default: false
      gh_release:
        description: "Publish a GitHub release with the selected desktop binaries"
        type: boolean
        default: true
      draft:
        description: "Create the GitHub release as a draft"
        type: boolean
        default: true
      linux:
        description: "Build Linux x86_64"
        type: boolean
        default: true
      linux_arm:
        description: "Build Linux ARM64"
        type: boolean
        default: false
      windows:
        description: "Build Windows x64 (beta)"
        type: boolean
        default: false
      windows_arm:
        description: "Build Windows ARM64 (beta)"
        type: boolean
        default: false
      macos:
        description: "Build macOS ARM64 (beta)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate inputs
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check version format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::version must look like 0.0.1"
            exit 1
          fi
      - name: Require at least one deliverable
        env:
          TESTFLIGHT: ${{ inputs.testflight }}
          LINUX: ${{ inputs.linux }}
          LINUX_ARM: ${{ inputs.linux_arm }}
          WINDOWS: ${{ inputs.windows }}
          WINDOWS_ARM: ${{ inputs.windows_arm }}
          MACOS: ${{ inputs.macos }}
        run: |
          set -euo pipefail
          if [ "$TESTFLIGHT" != "true" ] \
            && [ "$LINUX" != "true" ] \
            && [ "$LINUX_ARM" != "true" ] \
            && [ "$WINDOWS" != "true" ] \
            && [ "$WINDOWS_ARM" != "true" ] \
            && [ "$MACOS" != "true" ]; then
            echo "::error::select TestFlight or at least one platform"
            exit 1
          fi

  linux-x86_64:
    name: Linux x86_64
    needs: validate
    if: ${{ inputs.linux }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Build
        working-directory: desktop
        run: cargo build --release --locked
      - name: Package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf "dist/absolutetouch-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            -C desktop/target/release absolutetouch
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64
          path: dist/*.tar.gz
          if-no-files-found: error

  linux-aarch64:
    name: Linux ARM64
    needs: validate
    if: ${{ inputs.linux_arm }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Build
        working-directory: desktop
        run: cargo build --release --locked
      - name: Package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf "dist/absolutetouch-${VERSION}-aarch64-unknown-linux-gnu.tar.gz" \
            -C desktop/target/release absolutetouch
      - uses: actions/upload-artifact@v7
        with:
          name: linux-aarch64
          path: dist/*.tar.gz
          if-no-files-found: error

  windows-x86_64:
    name: Windows x64
    needs: validate
    if: ${{ inputs.windows }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Build
        working-directory: desktop
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive `
            -Path desktop/target/release/absolutetouch.exe `
            -DestinationPath "dist/absolutetouch-$($env:VERSION)-x86_64-pc-windows-msvc.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64
          path: dist/*.zip
          if-no-files-found: error

  windows-aarch64:
    name: Windows ARM64
    needs: validate
    if: ${{ inputs.windows_arm }}
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Build
        working-directory: desktop
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive `
            -Path desktop/target/release/absolutetouch.exe `
            -DestinationPath "dist/absolutetouch-$($env:VERSION)-aarch64-pc-windows-msvc.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-aarch64
          path: dist/*.zip
          if-no-files-found: error

  macos-aarch64:
    name: macOS ARM64
    needs: validate
    if: ${{ inputs.macos }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Build
        working-directory: desktop
        run: cargo build --release --locked
      - name: Package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf "dist/absolutetouch-${VERSION}-aarch64-apple-darwin.tar.gz" \
            -C desktop/target/release absolutetouch
      - uses: actions/upload-artifact@v7
        with:
          name: macos-aarch64
          path: dist/*.tar.gz
          if-no-files-found: error

  testflight:
    name: iOS TestFlight
    needs: validate
    if: ${{ inputs.testflight }}
    runs-on: xcode-27
    timeout-minutes: 60
    environment:
      name: testflight
    permissions:
      contents: read
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Show toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version

      - name: Cache Homebrew downloads
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: homebrew-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/ci.yml', '.github/workflows/release.yml') }}
          restore-keys: |
            homebrew-${{ runner.os }}-${{ runner.arch }}-

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          if command -v xcodegen >/dev/null 2>&1; then
            xcodegen --version
          else
            brew install xcodegen
          fi

      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      - name: Install Fastlane
        working-directory: ios
        run: |
          set -euo pipefail
          bundle config set --local path vendor/bundle
          bundle install --jobs 4

      - name: Decode App Store Connect key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::missing $name in the testflight environment"
              exit 1
            fi
          done
          printf '%s' "$ASC_KEY_P8_BASE64" \
            | tr -d '\r\n' \
            | openssl base64 -d -A -out "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Archive and upload
        id: archive
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
          MARKETING_VERSION: ${{ inputs.version }}
          FASTLANE_SKIP_UPDATE_CHECK: "true"
          FASTLANE_HIDE_CHANGELOG: "true"
        run: bundle exec fastlane ios beta upload:true

      - name: Upload signed IPA
        uses: actions/upload-artifact@v7
        with:
          name: ios-${{ inputs.version }}-build-${{ steps.archive.outputs.build_number }}
          path: ios/build/export/*.ipa
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs:
      - validate
      - linux-x86_64
      - linux-aarch64
      - windows-x86_64
      - windows-aarch64
      - macos-aarch64
      - testflight
    if: ${{ always() && !failure() && !cancelled() && inputs.gh_release && (inputs.linux || inputs.linux_arm || inputs.windows || inputs.windows_arm || inputs.macos) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Keep desktop binaries only
        run: |
          set -euo pipefail
          # The signed iOS IPA is a TestFlight artifact, not a desktop download.
          find dist -maxdepth 1 -name '*.ipa' -delete
      - name: List release files
        run: ls -l dist
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          name: AbsoluteTouch v${{ inputs.version }}
          draft: ${{ inputs.draft }}
          generate_release_notes: true
          files: dist/*
