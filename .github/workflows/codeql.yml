name: CodeQL

# Advanced setup for every language, because GitHub rejects uploads from an
# advanced configuration while default setup is enabled, and Swift cannot run
# under default setup: the core declares `swift-tools-version: 6.4`, so the
# extractor must trace a build made by a matching toolchain, and autobuild
# cannot select one.
#
# Revert to default setup with:
#   gh api --method PATCH repos/David735453/AbsoluteTouch/code-scanning/default-setup \
#     -f state=configured -f query_suite=default \
#     -f 'languages[]=actions' -f 'languages[]=python' \
#     -f 'languages[]=ruby' -f 'languages[]=rust'
# and delete this file; the two cannot run together.

on:
  push:
    branches: [main]
  schedule:
    # Weekly, a few hours apart from the other nightly work.
    - cron: "43 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      # One failing language must not hide the others.
      fail-fast: false
      matrix:
        include:
          # Interpreted or declarative: CodeQL needs no build.
          - language: actions
            build-mode: none
            runner: ubuntu-26.04
          - language: python
            build-mode: none
            runner: ubuntu-26.04
          - language: ruby
            build-mode: none
            runner: ubuntu-26.04
          # Rust has no autobuild mode in CodeQL v4; extraction is source-based.
          - language: rust
            build-mode: none
            runner: ubuntu-26.04
          # Only the UI-free core compiles without the generated Xcode project,
          # so that is all this job analyzes. The UIKit shell is compiled by the
          # `macos` job in `ci.yml`.
          - language: swift
            build-mode: manual
            runner: xcode-27
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build the Swift core
        if: matrix.language == 'swift'
        # Xcode 27 ships Apple Swift 6.4.2, which reads the package's 6.4
        # tools-version. Installing a separate toolchain here is counter-
        # productive: the open-source macOS build does not expose the `macosx`
        # platform and SwiftPM then cannot pick a target platform at all.
        #
        # SwiftPM's sandbox helper also cannot be spawned under the CodeQL
        # tracer on the arm64 runner; the package has no build plugins, so the
        # sandbox is not load-bearing.
        run: swift build --package-path ios/AbsoluteTouchCore --disable-sandbox
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
