name: CI

on:
  push:
    branches: [main]
  schedule:
    # Nightly full matrix, including the beta platforms, at an off-peak minute.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      linux:
        description: "Linux x86_64: Rust checks and Swift core tests"
        type: boolean
        default: true
      linux_arm:
        description: "Linux ARM64: Rust checks"
        type: boolean
        default: false
      windows:
        description: "Windows x64: Rust checks (beta)"
        type: boolean
        default: false
      windows_arm:
        description: "Windows ARM64: Rust checks (beta)"
        type: boolean
        default: false
      macos:
        description: "macOS: Swift core tests and iOS app build"
        type: boolean
        default: true
      lint:
        description: "Repository-wide formatting, lint, and vector checks"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Keep the nightly and push runs from cancelling each other; cancel stale
  # runs of the same event and ref (for example an older push to main).
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and lint
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.lint }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Golden vectors
        run: python3 tools/gen_vectors.py --check
      - name: Rust formatting
        working-directory: desktop
        run: cargo fmt --all -- --check
      - name: Swift formatting
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$PWD:/work" \
            -w /work \
            swift:6.4.1 \
            swift format lint --strict --recursive ios/AbsoluteTouchCore ios/App
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - name: Ruby and config syntax
        run: |
          set -euo pipefail
          ruby -c ios/Gemfile
          ruby -c ios/fastlane/Fastfile
          ruby -ryaml -e 'ARGV.each { |file| YAML.load_file(file) }' \
            .github/workflows/*.yml .github/dependabot.yml ios/project.yml
          ruby -rjson -e 'JSON.parse(File.read("protocol/vectors.json"))'
          python3 -c 'import plistlib, sys; plistlib.load(open(sys.argv[1], "rb"))' ios/App/Info.plist
          python3 -c 'import plistlib, sys; plistlib.load(open(sys.argv[1], "rb"))' ios/App/PrivacyInfo.xcprivacy
      - name: Workflow lint
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            rhysd/actionlint:1.7.12 \
            -ignore 'label ".*" is unknown' \
            -color

  linux:
    name: Linux x86_64
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.linux }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Check golden vectors
        run: python3 tools/gen_vectors.py --check
      - name: Rust formatting
        working-directory: desktop
        run: cargo fmt --all -- --check
      - name: Rust clippy
        working-directory: desktop
        run: cargo clippy --all-targets -- -D warnings
      - name: Rust tests
        working-directory: desktop
        run: cargo test --all-targets
      - name: Doctor
        working-directory: desktop
        run: cargo run --quiet -- doctor
      - name: Swift version
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$PWD:/work" \
            -w /work \
            swift:6.4.1 \
            swift --version
      - name: Swift formatting
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$PWD:/work" \
            -w /work \
            swift:6.4.1 \
            swift format lint --strict --recursive ios/AbsoluteTouchCore ios/App
      - name: Swift core tests
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$PWD:/work" \
            -w /work \
            swift:6.4.1 \
            swift test --package-path ios/AbsoluteTouchCore

  linux-arm:
    name: Linux ARM64
    if: ${{ inputs.linux_arm || github.event_name == 'schedule' }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Check golden vectors
        run: python3 tools/gen_vectors.py --check
      - name: Rust formatting
        working-directory: desktop
        run: cargo fmt --all -- --check
      - name: Rust clippy
        working-directory: desktop
        run: cargo clippy --all-targets -- -D warnings
      - name: Rust tests
        working-directory: desktop
        run: cargo test --all-targets

  windows:
    name: Windows x64
    if: ${{ inputs.windows || github.event_name == 'schedule' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Rust formatting
        working-directory: desktop
        run: cargo fmt --all -- --check
      - name: Rust clippy
        working-directory: desktop
        run: cargo clippy --all-targets -- -D warnings
      - name: Rust tests
        working-directory: desktop
        run: cargo test --all-targets

  windows-arm:
    name: Windows ARM64
    if: ${{ inputs.windows_arm || github.event_name == 'schedule' }}
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Rust formatting
        working-directory: desktop
        run: cargo fmt --all -- --check
      - name: Rust clippy
        working-directory: desktop
        run: cargo clippy --all-targets -- -D warnings
      - name: Rust tests
        working-directory: desktop
        run: cargo test --all-targets

  macos:
    name: macOS and iOS
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.macos }}
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - name: Show toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Cache Homebrew downloads
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: homebrew-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/ci.yml', '.github/workflows/release.yml') }}
          restore-keys: |
            homebrew-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache SwiftPM build
        uses: actions/cache@v6
        with:
          path: ios/AbsoluteTouchCore/.build
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-swift-6.4-v1-${{ hashFiles('ios/AbsoluteTouchCore/Package.swift') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-swift-6.4-v1-
      - name: Rust tests
        working-directory: desktop
        run: cargo test --all-targets
      - name: Swift core tests
        run: swift test --package-path ios/AbsoluteTouchCore
      - name: Swift formatting
        run: swift format lint --strict --recursive ios/AbsoluteTouchCore ios/App
      - name: Install SwiftLint
        run: |
          set -euo pipefail
          if command -v swiftlint >/dev/null 2>&1; then
            swiftlint version
          else
            brew install swiftlint
          fi
      - name: SwiftLint
        run: swiftlint lint --quiet --strict
      - name: Ruby syntax
        run: |
          set -euo pipefail
          ruby -c ios/Gemfile
          ruby -c ios/fastlane/Fastfile
      - name: Install XcodeGen
        run: |
          set -euo pipefail
          if command -v xcodegen >/dev/null 2>&1; then
            xcodegen --version
          else
            brew install xcodegen
          fi
      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml
      - name: Build iOS app
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/AbsoluteTouch.xcodeproj \
            -scheme AbsoluteTouch \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build
